<!DOCTYPE html>

<html>

<head>

    <title>DCGAN Face Generator</title>

    <meta charset="UTF-8">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .box {
            background: white;

            width: 500px;

            padding: 40px;

            text-align: center;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #666;
        }

        #face {
            width: 256px;
            height: 256px;

            object-fit: cover;

            display: none;

            margin: 25px auto;

            border-radius: 15px;

            border: 2px solid #ddd;
        }

        button {

            background: black;

            color: white;

            border: none;

            padding: 15px 30px;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {
            background: #333;
        }

        #loading {
            display: none;
            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>DCGAN Face Generator</h1>

    <p>
        Generate a random face using your trained DCGAN model.
    </p>


    <img
        id="face"
        src=""
        alt="Generated Face"
    >


    <br>


    <button
        id="generateButton"
        onclick="generateFace()"
    >

        Generate Random Face

    </button>


    <div id="loading">

        Generating face...

    </div>

</div>


<script>

async function generateFace() {

    const button =
        document.getElementById("generateButton");

    const image =
        document.getElementById("face");

    const loading =
        document.getElementById("loading");


    button.disabled = true;

    loading.style.display = "block";


    try {

        const response =
            await fetch("/generate");


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "Face generation failed"
            );

        }


        image.src =
            data.image +
            "?t=" +
            new Date().getTime();


        image.style.display = "block";


    }

    catch (error) {

        console.error(error);

        alert(
            "Error generating face. Check the terminal."
        );

    }


    loading.style.display = "none";

    button.disabled = false;

}

</script>


</body>

</html>
